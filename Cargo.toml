[package]
name = "bevy-web-drop-image-as-sprite"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_winit",
    "bevy_sprite_render",
    "bevy_log",
    "webgl2",
    "png",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
bevy_channel_trigger = "0.8.0"

# Default features drag in `gloo-history` -> `getrandom`, which needs a
# `getrandom_backend` rustflag on wasm32-unknown-unknown.
[target.'cfg(target_family = "wasm")'.dependencies.gloo]
version = "0.11"
default-features = false
features = ["utils", "events"]

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
version = "0.3"
features = [
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DragEvent",
    "File",
    "FileReader",
]
